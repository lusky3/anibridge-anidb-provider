[project]
name = "anibridge-anidb-provider"
version = "0.1.0"
description = "AniDB provider for the AniBridge project."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"

authors = [
    { name = "AniBridge Contributors" },
]

keywords = ["anibridge", "anidb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "anibridge-provider-base>=0.1.0a3,<0.2",
    "aiohttp>=3.14.3",
    "msgspec>=0.21.1",
    "pycryptodome>=3.20",
]

[tool.ruff]
indent-width = 4
line-length = 88

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["A","ASYNC","B","C4","D","E","F","FURB","G","I","N","PERF","PLC","PLE","RUF","SIM","UP","W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --import-mode=importlib"
asyncio_mode = "auto"

[tool.uv]
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "anibridge"
namespace = true

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
